server.port=${PORT:8081}

# In-Memory H2 Database for local development/testing
spring.datasource.url=jdbc:h2:mem:study_buddy_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=true
spring.sql.init.mode=never

# Security & JWT
app.jwt.secret=studyBuddySecretKeyWhichIsAtLeast256BitsLongForSha256Security123456
app.jwt.expiration-ms=86400000

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
